name: TITRATIONSTOOL chemistry regression
on:
  push:
    branches: [main, feature/citric-brausetablette]
    paths:
      - index.html
      - tests/**
      - .github/workflows/titration-regression.yml
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/titration-regression.cjs
